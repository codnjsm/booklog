<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1.0은 iOS에서 입력칸을 누를 때 화면이 자동 확대되는 걸 막는다(실기기 확인).
         입력칸 폰트가 16px 미만이면 생기는 현상이라, 폰트를 16px로 올리면 이 값 없이도 해결된다.
         다만 이 값은 안드로이드에서 핀치 줌까지 막으므로, 폰트 조정 시 함께 걷어내는 게 좋다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Booklog</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Booklog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="읽은 책과 마음에 남은 문장을 기록하고, 친구와 나누는 독서 기록장" />

    <!-- 카톡 등에 주소를 보냈을 때 뜨는 미리보기.
         설명이 없으면 「여기를 눌러 링크를 확인하세요」 같은 기본 문구가 대신 들어간다.
         미리보기는 주소 단위로 캐시되므로, 고친 뒤 확인할 때는 주소 뒤에 ?1을 붙여 보낼 것. -->
    <meta property="og:site_name" content="Booklog" />
    <meta property="og:title" content="Booklog" />
    <meta property="og:description" content="읽은 책과 마음에 남은 문장을 기록하고, 친구와 나누는 독서 기록장" />
    <meta property="og:image" content="https://reading-notes-6935e.web.app/og-image.jpg" />
    <meta property="og:image:width" content="724" />
    <meta property="og:image:height" content="1024" />
    <meta property="og:image:alt" content="쌓아놓은 책 그림" />
    <meta property="og:url" content="https://reading-notes-6935e.web.app" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Code+Pro:wght@400;500;600;700&display=swap"
    />
  </head>
  <body class="bg-bg text-ink font-sans text-sm sm:text-base leading-[1.6] transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
