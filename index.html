<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1.0은 iOS에서 입력칸을 누를 때 화면이 자동 확대되는 걸 막는다(실기기 확인).
         입력칸 폰트가 16px 미만이면 생기는 현상이라, 폰트를 16px로 올리면 이 값 없이도 해결된다.
         다만 이 값은 안드로이드에서 핀치 줌까지 막으므로, 폰트 조정 시 함께 걷어내는 게 좋다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>Booklog</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Booklog" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="읽은 책과 마음에 남은 문장을 기록하는 곳. 문장을 모으고, 친구와 나누고, 함께 기록해요."
    />

    <!-- 카톡·트위터 등에 주소를 보냈을 때 뜨는 미리보기.
         og:image는 가로 1200x630(1.91:1)이어야 한다 — 세로 이미지를 주면 잘리거나 작은 섬네일이 된다.
         캐시는 URL 단위라 이미지를 고칠 때는 파일명을 바꿔야 새로 읽는다. -->
    <meta property="og:site_name" content="Booklog" />
    <meta property="og:title" content="Booklog — 독서 기록" />
    <meta
      property="og:description"
      content="읽은 책과 마음에 남은 문장을 기록하는 곳. 문장을 모으고, 친구와 나누고, 함께 기록해요."
    />
    <meta property="og:image" content="https://reading-notes-6935e.web.app/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Booklog — 읽은 책과 마음에 남은 문장을 기록하는 곳" />
    <meta property="og:url" content="https://reading-notes-6935e.web.app" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Code+Pro:wght@400;500;600;700&display=swap"
    />
  </head>
  <body class="bg-bg text-ink font-sans text-sm sm:text-base leading-[1.6] transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
